version: 2
sources:
  - name: raw_sf
    schema: raw_sf
    tables:
      - name: Account
      - name: donations
      - name: bucket_of_parquets
        external:
          location: 'gs://bucket-of-parquets/*'
          connection_id: 'po1demo.northamerica-northeast1.bucket-of-parquet-conn'
          hive_partitioning_options:
            mode: AUTO
          options:
            format: parquet
