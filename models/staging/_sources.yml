version: 2
sources:
  - name: raw_sf
    schema: raw_sf
    tables:
      - name: Account
      - name: donations

  - name: bucket_of_parquets
    schema: raw_sf
    tables:
      - name: bucket_of_parquets
        external:
          location: 'gs://bucket-of-parquets/*'
          options:
            format: parquet
            hive_partitioning_mode: AUTO
            connection_id: 'po1demo.northamerica-northeast1.bucket-of-parquet-conn'