version: 2
sources:
  - name: raw_sf
    schema: raw_sf
    tables:
      - name: Account
      - name: donations
      - name: bucket_of_parquets
        external:
          location: 'gs://bucket-of-parquets/*'
          connection_id: 'projects/po1demo/locations/northamerica-northeast1/connections/bucket-of-parquet-conn'
          hive_partitioning_options:
            mode: AUTO
          options:
            format: parquet
            metadata_cache_mode: AUTOMATIC
            max_staleness: 'INTERVAL 4 HOUR'
